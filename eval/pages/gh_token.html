<!doctype html><html lang="en"><head><meta charset="utf-8"><title>New fine-grained personal access token</title><style>body{font:16px/1.6 sans-serif;margin:0;color:#222}header{background:#24292f;color:#fff;padding:10px 20px}
header a{color:#fff;margin-right:14px}main{max-width:760px;margin:0 auto;padding:20px}
.row{margin:12px 0}label.name{display:inline-block;width:200px}input[type=text]{padding:6px;width:300px}
button,.btn{padding:8px 16px;margin:4px 4px 4px 0;font-size:16px;cursor:pointer}
.danger{border:2px solid #c62828;border-radius:8px;padding:8px 16px;margin:16px 0}
.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding:8px 0}
.banner{background:#fff3cd;border:1px solid #e0a800;padding:10px;margin:10px 0;display:flex;justify-content:space-between}
.note{color:#666;font-size:14px}footer{color:#888;font-size:13px;padding:20px;text-align:center}</style></head><body><header><a href="#">Code</a><a href="#">Issues</a><a href="#">Pull requests</a><a href="#" id="tab-settings">Settings</a></header><main>
<h1>New fine-grained personal access token</h1>
<div class="row"><label class="name" for="tk-name">Token name *</label><input type="text" id="tk-name" required></div>
<div class="row"><label class="name" for="tk-exp">Expiration</label><select id="tk-exp"><option>30 days</option><option>90 days</option><option>No expiration</option></select></div>
<h2>Repository access</h2>
<div class="row"><label><input type="radio" name="ra" id="ra-public" checked> Public repositories (read-only)</label></div>
<div class="row"><label><input type="radio" name="ra" id="ra-all"> All repositories</label></div>
<div class="row"><label><input type="radio" name="ra" id="ra-select"> Only select repositories</label></div>
<h2>Permissions</h2><p class="note">Repository permissions: Actions — Access: Read and write</p>
<button id="tk-generate" type="button">Generate token</button></main><footer>架空の評価用ページです（実在のサービスの画面ではありません）</footer></body></html>
